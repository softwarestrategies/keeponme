# Default Configuration (Applies if no profile is active, or serves as a base)

server:
  port: 9090

spring:
  application:
    name: keeponme-orchestrator

  datasource:
    url: SEE PROFILE
    username: SEE PROFILE
    password: SEE PROFILE
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Changed from 'update' - Flyway manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
  
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: keeponme-client
            client-secret: your-static-secret-here-change-in-production
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: SEE PROFILE
            user-name-attribute: SEE PROFILE

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.keeponme: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

---

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/keeponme
    username: keeponme
    password: changeme
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/keeponme
            user-name-attribute: preferred_username

---

spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/keeponme
    username: keeponme
    password: changeme
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://keycloak:8080/realms/keeponme
            user-name-attribute: preferred_username
