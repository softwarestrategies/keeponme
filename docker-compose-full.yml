services:
  postgres:
    image: postgres:16-alpine
    container_name: keeponme-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-local-data/postgresql/data:/var/lib/postgresql/data
      - ./setup/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: keeponme-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: changeme
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    volumes:
      # Import realm on startup
      - ./setup/keycloak-realm-config.json:/opt/keycloak/data/import/keycloak-realm-config.json:ro
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keeponme-app
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: keeponme
      DB_USERNAME: keeponme
      DB_PASSWORD: changeme
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/keeponme
      KEYCLOAK_AUTH_URI: http://localhost:9090/realms/keeponme/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/keeponme/protocol/openid-connect/token
      KEYCLOAK_USERINFO_URI: http://keycloak:8080/realms/keeponme/protocol/openid-connect/userinfo
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/keeponme/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: keeponme-app
      KEYCLOAK_CLIENT_SECRET: your-client-secret-change-in-production
      SERVER_PORT: 8080
      COOKIE_SECURE: false
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - keeponme-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local